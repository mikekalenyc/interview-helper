name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install test dependencies
        run: python -m pip install -e '.[dev,gui]'
      - name: Tests
        run: python -m pytest
      - name: Type checks
        run: python -m mypy interview_helper scripts/prepare_github_release.py
      - name: Build source distribution and wheel
        run: python -m build
      - name: Check installed wheel entry points
        run: |
          python -m venv /tmp/interview-helper-wheel
          /tmp/interview-helper-wheel/bin/python -m pip install dist/*.whl
          /tmp/interview-helper-wheel/bin/python -m pip check
          cd /tmp
          /tmp/interview-helper-wheel/bin/interview-helper --help
          /tmp/interview-helper-wheel/bin/interview-helper-gui --help
          /tmp/interview-helper-wheel/bin/interview-helper-install-turn-models --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-python-${{ matrix.python-version }}
          path: dist/*
