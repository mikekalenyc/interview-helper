[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-helper"
version = "0.1.0"
description = "Linux interview assistant with local transcription and personalized answer context"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.7,<7",
  "moonshine-voice==0.1.5",
  "onnxruntime>=1.20,<2",
  "transformers>=4.45,<5",
]
input = ["evdev>=1.7,<2"]
moonshine = ["moonshine-voice==0.1.5"]
gui = ["PySide6>=6.7,<7"]
automatic = ["onnxruntime>=1.20,<2", "transformers>=4.45,<5"]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "build>=1.2,<2",
]

[project.urls]
Repository = "https://github.com/mikekalenyc/interview-helper"
Issues = "https://github.com/mikekalenyc/interview-helper/issues"

[project.scripts]
interview-helper = "interview_helper.cli:main"
interview-helper-gui = "interview_helper.gui:main"
interview-helper-install-turn-models = "interview_helper.install_turn_models:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["interview_helper*"]
